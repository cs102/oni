<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circular Solar System</title>
<style>
  body {
    background-color: black;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;
  }

  h1 {
    margin-bottom: 20px;
  }

  /* Container for the whole system */
  .system-container {
    position: relative;
    width: 800px;
    height: 800px;
  }

  /* Center Sun */
  .sun {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background-color: yellow;
    border-radius: 50%;
    box-shadow: 0 0 30px 10px yellow;
    z-index: 3;
  }

  /* Orbital circles for planets */
  .orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* Individual orbits with varying radii and rotation speeds */
  .orbit1 { width: 200px; height: 200px; animation: rotateOrbit 20s linear infinite; }
  .orbit2 { width: 300px; height: 300px; animation: rotateOrbit 30s linear infinite; }
  .orbit3 { width: 400px; height: 400px; animation: rotateOrbit 50s linear infinite; }
  .orbit4 { width: 500px; height: 500px; animation: rotateOrbit 70s linear infinite; }
  .orbit5 { width: 600px; height: 600px; animation: rotateOrbit 90s linear infinite; }
  .orbit6 { width: 700px; height: 700px; animation: rotateOrbit 110s linear infinite; }
  .orbit7 { width: 800px; height: 800px; animation: rotateOrbit 120s linear infinite; }
  .orbit8 { width: 900px; height: 900px; animation: rotateOrbit 140s linear infinite; }
  
  @keyframes rotateOrbit {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* Planet styles and placement on orbits */
  .planet {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: calc(100% / 2) calc(100% / 2);
  }

  /* Specific planets with sizes and colors */
  .mercury {
    width: 15px;
    height: 15px;
    background-color: #a9a9a9;
    border-radius: 50%;
    transform: translateX(100px);
  }

  .venus {
    width: 20px;
    height: 20px;
    background-color: #c67171;
    border-radius: 50%;
    transform: translateX(150px);
  }

  .earth {
    width: 25px;
    height: 25px;
    background-color: #1e90ff;
    border-radius: 50%;
    transform: translateX(200px);
  }

  .mars {
    width: 20px;
    height: 20px;
    background-color: #ff4500;
    border-radius: 50%;
    transform: translateX(250px);
  }

  .jupiter {
    width: 40px;
    height: 40px;
    background-color: #daa520;
    border-radius: 50%;
    transform: translateX(300px);
  }

  .saturn {
    width: 35px;
    height: 35px;
    background-color: #deb887;
    border-radius: 50%;
    transform: translateX(350px);
  }

  .uranus {
    width: 28px;
    height: 28px;
    background-color: #87cefa;
    border-radius: 50%;
    transform: translateX(400px);
  }

  .neptune {
    width: 28px;
    height: 28px;
    background-color: #4169e1;
    border-radius: 50%;
    transform: translateX(450px);
  }

  /* Position labels below planets */
  .label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateY(20px);
    font-size: 10px;
    text-align: center;
    white-space: nowrap;
  }

  /* Moons orbit */
  .moon-orbit {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: center;
    animation: moonOrbitRotate 4s linear infinite;
  }

  @keyframes moonOrbitRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Moon styles */
  .moon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    background-color: #d3d3d3;
    border-radius: 50%;
    transform: translateX(15px) translateY(-50%);
  }

  /* Moons for Earth */
  .earth-moon {
    --orbit-radius: 15px;
    width: calc(var(--orbit-radius) * 2);
    height: calc(var(--orbit-radius) * 2);
  }

  /* Moons for Mars */
  .mars-moon {
    --orbit-radius: 12px;
    width: calc(var(--orbit-radius) * 2);
    height: calc(var(--orbit-radius) * 2);
  }

</style>
</head>
<body>
<h1>Circular Solar System</h1>
<div class="system-container">
  <!-- Sun -->
  <div class="sun"></div>

  <!-- Orbit paths for planets -->
  <div class="orbit orbit1"></div>
  <div class="orbit orbit2"></div>
  <div class="orbit orbit3"></div>
  <div class="orbit orbit4"></div>
  <div class="orbit orbit5"></div>
  <div class="orbit orbit6"></div>
  <div class="orbit orbit7"></div>

  <div class="orbit orbit8"></div>
  <!-- Mercury -->

  <div class="planet mercury" style="animation: rotateOrbit 20s linear infinite; transform-origin: 50% 50%; translate: calc(200px) 0;">
    <div class="label">Mercury</div>
  </div>
  <!-- Venus -->
  <div class="planet venus" style="animation: rotateOrbit 30s linear infinite; transform-origin: 50% 50%; translate: calc(300px) 0;">
    <div class="label">Venus</div>
  </div>
  <!-- Earth with Moons -->
  <div class="planet earth" style="animation: rotateOrbit 50s linear infinite; transform-origin: 50% 50%; translate: calc(400px) 0;">
    <div class="label">Earth</div>
    <!-- Earth's Moons -->
    <div class="moon orbit" style="animation: rotateOrbit 4s linear infinite;">
      <div class="moon earth-moon"></div>
      <div class="label" style="top: 0; left: 20px;">Moon</div>
    </div>
  </div>
  <!-- Mars with Moons -->
  <div class="planet mars" style="animation: rotateOrbit 70s linear infinite; transform: translateX(500px);">
    <div class="label">Mars</div>
    <!-- Mars Moons -->
    <div class="moon orbit" style="animation: rotateOrbit 4s linear infinite; --orbit-radius: 12px;">
      <div class="moon mars-moon"></div>
      <div class="label" style="top: 0; left: 15px;">Deimos</div>
    </div>
  </div>
  <!-- Jupiter -->
  <div class="planet jupiter" style="animation: rotateOrbit 90s linear infinite; transform: translateX(600px);">
    <div class="label">Jupiter</div>
  </div>
  <!-- Saturn -->
  <div class="planet saturn" style="animation: rotateOrbit 110s linear infinite; transform: translateX(700px);">
    <div class="label">Saturn</div>
  </div>
  <!-- Uranus -->
  <div class="planet uranus" style="animation: rotateOrbit 130s linear infinite; transform: translateX(800px);">
    <div class="label">Uranus</div>
  </div>
  <!-- Neptune -->
  <div class="planet neptune" style="animation: rotateOrbit 150s linear infinite; transform: translateX(900px);">
    <div class="label">Neptune</div>
  </div>
</div>
</body>
</html>
